# Viora social web (Netlify)
#
# Required Netlify env vars (Site settings → Environment variables):
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_ANON_KEY
# Optional:
#   VITE_ANDROID_APK_URL   (direct APK / EAS artifact URL for /app)
#   VITE_IOS_APP_URL       (App Store / TestFlight link)

[build]
  base = "."
  command = "npm install && npm run build --workspace=@viora/web"
  publish = "apps/social-web/dist"

[build.environment]
  NODE_VERSION = "20"
  GIT_LFS_ENABLED = "true"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Content-Disposition = "attachment"
